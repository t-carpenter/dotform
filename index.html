<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dotform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      background: #FEFFF9;
      overflow: hidden;
    }

    #controls {
      width: 340px;
      background: #F7F8F2;
      padding: 32px 24px 24px 24px;
      gap: 12px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow-y: auto;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      margin-bottom: 6px;
      display: block;
    }

    input[type=text] {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      margin-bottom: 12px;
      border: none;
      background: #fff;
      box-sizing: border-box;
    }

    .tabs {
      display: flex;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid #282634;
      height: 44px;
    }

    .tab {
      flex: 1;
      padding: 10px 16px;
      text-align: center;
      border: none;
      font-weight: 500;
      cursor: pointer;
      background: #F7F8F2;
      color: #040406;
      font-size: 12px;
      transition: background 0.2s, color 0.2s;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab:hover:not(.active) {
      background: rgba(4, 4, 6, 0.08);
    }

    .tab.active {
      background: #282634;
      color: #ffffff;
    }

    .slider-container {
      margin-bottom: 12px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .slider-value {
      font-size: 12px;
      font-weight: 600;
      color: #040406;
    }

    input[type=range] {
      width: 100%;
      appearance: none;
      height: 2px;
      background: #ccc;
      margin: 6px 0;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #040406;
      cursor: pointer;
    }

    input[type=range]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #040406;
      cursor: pointer;
      border: none;
    }

    .color-picker-wrapper {
      background: #040406;
      height: 40px;
      width: 100%;
      margin-bottom: 16px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      display: block;
    }

    input[type=color] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 12px;
    }

    button {
      font-size: 13px;
      background: #282634;
      color: #fff;
      padding: 10px 16px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1a1825;
    }

    .copyright {
      font-size: 9px;
      color: rgba(4, 4, 6, 0.5);
      margin-top: 12px;
      text-align: left;
    }

    #canvas-container {
      flex: 1;
      background: #FEFFF9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h1>Dotform</h1>

    <label for="textInput">Type your text</label>
    <input type="text" id="textInput" value="dotform" />

    <div class="tabs">
      <button class="tab active" id="tabDots">Dots</button>
      <button class="tab" id="tabLines">Lines</button>
    </div>

    <div class="slider-container">
      <div class="slider-header">
        <label for="dotCount" style="margin: 0;">Number of dots/lines</label>
        <span class="slider-value" id="dotCountValue">150</span>
      </div>
      <input type="range" id="dotCount" min="10" max="500" value="150">
    </div>

    <div class="slider-container">
      <div class="slider-header">
        <label for="dotSize" style="margin: 0;">Dot/Line size</label>
        <span class="slider-value" id="dotSizeValue">4</span>
      </div>
      <input type="range" id="dotSize" min="1" max="400" value="4">
    </div>

    <div class="slider-container">
      <div class="slider-header">
        <label for="textSize" style="margin: 0;">Text size</label>
        <span class="slider-value" id="textSizeValue">160</span>
      </div>
      <input type="range" id="textSize" min="10" max="300" value="160">
    </div>

    <div class="slider-container">
      <div class="slider-header">
        <label for="lineSpacing" style="margin: 0;">Letter spacing</label>
        <span class="slider-value" id="lineSpacingValue">0</span>
      </div>
      <input type="range" id="lineSpacing" min="0" max="100" value="0">
    </div>

    <div class="slider-container">
      <div class="slider-header">
        <label for="fillOpacity" style="margin: 0;">Fill opacity</label>
        <span class="slider-value" id="fillOpacityValue">100</span>
      </div>
      <input type="range" id="fillOpacity" min="0" max="100" value="100">
    </div>

    <label for="fillColor">Fill color</label>
    <div class="color-picker-wrapper" id="fillColorPreview">
      <input type="color" id="fillColor" value="#040406">
    </div>

    <div class="button-row">
      <button id="resetBtn">Reset</button>
      <button id="exportBtn">Export PNG</button>
    </div>
    
    <div class="copyright">©2025 Tim Carpenter</div>
  </div>

  <div id="canvas-container">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script>
      let currentText = "dotform";
      let mode = "dot";
      let darkPixels = [];

      function setup() {
        createCanvas(window.innerWidth - 340, window.innerHeight).parent("canvas-container");
        textFont("Helvetica");
        textAlign(CENTER, CENTER);
        pixelDensity(1);
        noLoop();
        setupUI();
        drawDotform();
      }

      function windowResized() {
        resizeCanvas(window.innerWidth - 340, window.innerHeight);
        drawDotform();
      }

      function setupUI() {
        const $ = id => document.getElementById(id);

        $("textInput").addEventListener("input", e => {
          currentText = e.target.value;
          drawDotform();
        });

        $("tabDots").addEventListener("click", () => {
          mode = "dot";
          $("tabDots").classList.add("active");
          $("tabLines").classList.remove("active");
          drawDotform();
        });

        $("tabLines").addEventListener("click", () => {
          mode = "line";
          $("tabDots").classList.remove("active");
          $("tabLines").classList.add("active");
          drawDotform();
        });

        // Setup sliders with value display
        const sliders = [
          { id: "dotCount", valueId: "dotCountValue" },
          { id: "dotSize", valueId: "dotSizeValue" },
          { id: "textSize", valueId: "textSizeValue" },
          { id: "lineSpacing", valueId: "lineSpacingValue" },
          { id: "fillOpacity", valueId: "fillOpacityValue" }
        ];

        sliders.forEach(({ id, valueId }) => {
          const slider = $(id);
          const valueDisplay = $(valueId);
          slider.addEventListener("input", () => {
            valueDisplay.textContent = slider.value;
            drawDotform();
          });
        });

        // Color pickers with preview
        $("fillColor").addEventListener("input", e => {
          $("fillColorPreview").style.background = e.target.value;
          drawDotform();
        });

        $("resetBtn").addEventListener("click", () => {
          currentText = "";
          $("textInput").value = "";
          drawDotform();
        });

        $("exportBtn").addEventListener("click", () => {
          saveCanvas("dotform_output", "png");
        });
      }

      function drawDotform() {
        background("#FEFFF9");

        let dotCount = parseInt(document.getElementById("dotCount").value);
        let dotSize = parseInt(document.getElementById("dotSize").value);
        let fontSize = parseInt(document.getElementById("textSize").value);
        let letterSpacing = parseInt(document.getElementById("lineSpacing").value);
        let opacity = parseInt(document.getElementById("fillOpacity").value) / 100;
        let fillCol = document.getElementById("fillColor").value;

        // Create offscreen graphics to render text
        let pg = createGraphics(width, height);
        pg.pixelDensity(1);
        pg.background(255);
        pg.textFont("Helvetica");
        pg.textSize(fontSize);
        pg.textAlign(CENTER, CENTER);
        pg.fill(0);
        pg.translate(pg.width / 2, pg.height / 2);
        
        // Apply letter spacing by rendering each character separately
        if (letterSpacing > 0) {
          let chars = currentText.split('');
          let totalWidth = 0;
          let charWidths = [];
          
          // Calculate total width with spacing
          for (let char of chars) {
            let w = pg.textWidth(char);
            charWidths.push(w);
            totalWidth += w + letterSpacing;
          }
          totalWidth -= letterSpacing; // Remove last spacing
          
          // Draw characters with spacing
          let xPos = -totalWidth / 2;
          for (let i = 0; i < chars.length; i++) {
            pg.text(chars[i], xPos + charWidths[i] / 2, 0);
            xPos += charWidths[i] + letterSpacing;
          }
        } else {
          pg.text(currentText, 0, 0);
        }
        
        pg.loadPixels();

        // Collect dark pixels
        darkPixels = [];
        for (let y = 0; y < pg.height; y++) {
          for (let x = 0; x < pg.width; x++) {
            let i = 4 * (y * pg.width + x);
            if (pg.pixels[i] < 128) darkPixels.push({ x, y });
          }
        }

        let alpha = opacity * 255;
        let [r, g, b] = hexToRGB(fillCol);

        // Draw dots or lines
        for (let i = 0; i < dotCount; i++) {
          let pt = random(darkPixels);
          if (!pt) continue;

          if (mode === "dot") {
            fill(r, g, b, alpha);
            noStroke();
            ellipse(pt.x, pt.y, dotSize, dotSize);
          } else {
            // Lines mode
            push();
            stroke(r, g, b, alpha);
            strokeWeight(dotSize);
            translate(pt.x, pt.y);
            let angle = random(TWO_PI);
            rotate(angle);
            let lineLength = dotSize * 3;
            line(-lineLength / 2, 0, lineLength / 2, 0);
            pop();
          }
        }
      }

      function hexToRGB(hex) {
        return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
      }
    </script>
  </div>
</body>
</html>
